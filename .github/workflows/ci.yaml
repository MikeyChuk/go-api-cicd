name: StackLaunch CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: stacklaunch-go-api
  ECS_CLUSTER: stacklaunch-lab-dev-ecs
  ECS_SERVICE: stacklaunch-dev-api
  ECS_TASK_DEFINITION: ecs/task-definition.json
  ECS_CONTAINER_NAME: api

jobs:

  test:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Run vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...

      - name: Verify Go build
        run: go build ./...


  build-and-push:
    needs: test

    runs-on: ubuntu-latest

    # PRs can test the code,v3
    # but only a push to master may publish an image to AWS.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    services:

      postgres:
        image: postgres:16

        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U testuser -d testdb"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug GitHub OIDC claims
        shell: bash
        run: |
          RESPONSE=$(curl -sSf \
           -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
           "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "$RESPONSE" | jq -r '.value')

          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f2)

          # Add base64 padding if needed
          case $((${#PAYLOAD} % 4)) in
           2) PAYLOAD="${PAYLOAD}==" ;;
           3) PAYLOAD="${PAYLOAD}=" ;;
          esac

          echo "$PAYLOAD" \
            | tr '_-' '/+' \
            | base64 -d \
            | jq '{sub, aud, repository, repository_owner, ref}'

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::303974373405:role/stacklaunch-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
         docker build \
           -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
           .

      - name: Run API container
        run: |
          docker run -d \
            --name stacklaunch-api-test \
            -p 8080:8080 \
            -e DB_HOST=host.docker.internal \
            -e DB_PORT=5432 \
            -e DB_USER=testuser \
            -e DB_PASSWORD=testpassword \
            -e DB_NAME=testdb \
            -e DB_SSLMODE=disable \
            --add-host=host.docker.internal:host-gateway \
            ${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Test container health endpoint
        run: |
          for i in {1..10}; do

            if curl --fail http://localhost:8080/health; then
              echo "API health check passed"
              exit 0
            fi

            echo "Waiting for API..."
            sleep 2

          done

          echo "API failed health check"

          docker logs stacklaunch-api-test

          exit 1

      - name: Tag image for ECR
        run: |
          docker tag \
            ${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Push image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push \
            $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Render ECS task definition
        id: render-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
         task-definition: ${{ env.ECS_TASK_DEFINITION }}
         container-name: ${{ env.ECS_CONTAINER_NAME }}
         image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Deploy ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-definition.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Verify production health endpoint
        run: |
         curl --fail https://stacklaunch-dev-alb-1250476172.eu-west-1.elb.amazonaws.com/health

